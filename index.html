<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minh Tín Plastics | Giải Pháp Bao Bì B2B Toàn Diện</title>
    <meta name="description" content="Minh Tín Plastics (MTP) - Nhà sản xuất bao bì, thùng carton, túi giấy, màng nhựa PE hàng đầu cho doanh nghiệp B2B tại Việt Nam.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== RESET & BASE ===== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
        }

        /* ===== FULL-SCREEN IFRAME ===== */
        #style-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            transition: opacity 0.4s ease;
        }
        #style-frame.loading { opacity: 0.3; }

        /* ===== FLOATING STYLE SWITCHER ===== */
        .style-switcher {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            align-items: center;
            gap: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Toggle Button */
        .switcher-toggle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 
                0 8px 32px rgba(102, 126, 234, 0.4),
                0 0 0 3px rgba(255,255,255,0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }
        .switcher-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: 
                0 12px 40px rgba(102, 126, 234, 0.6),
                0 0 0 3px rgba(255,255,255,0.2);
        }
        .switcher-toggle .icon-palette { transition: transform 0.4s ease; }
        .switcher-toggle.open .icon-palette { transform: rotate(180deg); }

        /* Panel */
        .switcher-panel {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0;
            max-width: 0;
            overflow: hidden;
            opacity: 0;
            background: rgba(15, 15, 25, 0.92);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            margin-left: -28px;
            padding-left: 36px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .switcher-panel.open {
            max-width: 600px;
            opacity: 1;
            padding: 8px 16px 8px 42px;
        }

        /* Style Buttons */
        .style-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border: 2px solid transparent;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }
        .style-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .style-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }
        .style-btn:hover::before { opacity: 1; }

        .style-btn .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: all 0.35s ease;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.15);
        }
        .style-btn:hover .dot {
            box-shadow: 0 0 12px currentColor, 0 0 0 2px currentColor;
            transform: scale(1.2);
        }

        .style-btn .label {
            font-size: 0.82rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.3px;
            transition: color 0.3s ease;
            position: relative;
            z-index: 1;
        }
        .style-btn:hover .label { color: rgba(255, 255, 255, 0.95); }

        /* Active state */
        .style-btn.active {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }
        .style-btn.active .label {
            color: #fff;
        }
        .style-btn.active .dot {
            box-shadow: 0 0 16px currentColor, 0 0 0 3px currentColor;
            transform: scale(1.15);
        }

        /* Individual style colors */
        .style-btn[data-style="blue"] .dot { background: #4A80AA; color: #4A80AA; }
        .style-btn[data-style="blue"]::before { background: linear-gradient(135deg, rgba(74,128,170,0.15), transparent); }
        
        .style-btn[data-style="green"] .dot { background: #4caf50; color: #4caf50; }
        .style-btn[data-style="green"]::before { background: linear-gradient(135deg, rgba(76,175,80,0.15), transparent); }
        
        .style-btn[data-style="orange"] .dot { background: #D66D42; color: #D66D42; }
        .style-btn[data-style="orange"]::before { background: linear-gradient(135deg, rgba(214,109,66,0.15), transparent); }
        
        .style-btn[data-style="original"] .dot { background: #F46F22; color: #F46F22; }
        .style-btn[data-style="original"]::before { background: linear-gradient(135deg, rgba(244,111,34,0.15), transparent); }

        /* Loading indicator  */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .loading-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }
        
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Tooltip on hover */
        .style-btn .tooltip-text {
            display: none;
        }

        /* Mobile responsive */
        @media (max-width: 700px) {
            .style-switcher {
                bottom: 16px;
            }
            .switcher-toggle {
                width: 48px;
                height: 48px;
                font-size: 1.1rem;
            }
            .switcher-panel.open {
                padding: 6px 12px 6px 36px;
            }
            .style-btn {
                padding: 8px 12px;
                gap: 6px;
            }
            .style-btn .dot {
                width: 12px;
                height: 12px;
            }
            .style-btn .label {
                font-size: 0.75rem;
            }
        }

        @media (max-width: 480px) {
            .style-switcher {
                bottom: 12px;
                left: 12px;
                right: 12px;
                transform: none;
            }
            .switcher-panel.open {
                max-width: calc(100vw - 80px);
                flex-wrap: nowrap;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .switcher-panel.open::-webkit-scrollbar { display: none; }
        }

        /* Initial page load animation */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .style-switcher {
            animation: fadeInUp 0.6s ease 0.5s backwards;
        }
    </style>
</head>
<body>

    <!-- Full-Screen iframe -->
    <iframe id="style-frame" src="styles/blue/index.html" title="Minh Tín Plastics"></iframe>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- Floating Style Switcher -->
    <div class="style-switcher" id="styleSwitcher">
        <div class="switcher-panel" id="switcherPanel">
            <button class="style-btn active" data-style="blue" id="btn-blue" title="Navy Blue Premium">
                <span class="dot"></span>
                <span class="label">Navy Blue</span>
            </button>
            <button class="style-btn" data-style="green" id="btn-green" title="Green Manufacturing">
                <span class="dot"></span>
                <span class="label">Green</span>
            </button>
            <button class="style-btn" data-style="orange" id="btn-orange" title="Terra Orange Elegant">
                <span class="dot"></span>
                <span class="label">Orange</span>
            </button>
            <button class="style-btn" data-style="original" id="btn-original" title="Classic Original">
                <span class="dot"></span>
                <span class="label">Original</span>
            </button>
        </div>
        <button class="switcher-toggle" id="switcherToggle" title="Chuyển đổi Style">
            <i class="fa-solid fa-palette icon-palette"></i>
        </button>
    </div>

    <script>
        // === Style Switcher Logic ===
        const frame = document.getElementById('style-frame');
        const toggle = document.getElementById('switcherToggle');
        const panel = document.getElementById('switcherPanel');
        const overlay = document.getElementById('loadingOverlay');
        const btns = document.querySelectorAll('.style-btn');
        
        let currentStyle = 'blue';
        let panelOpen = false;

        // Style map
        const styleMap = {
            blue: 'styles/blue/index.html',
            green: 'styles/green/index.html',
            orange: 'styles/orange/index.html',
            original: 'styles/original/index.html'
        };

        // Toggle panel
        toggle.addEventListener('click', () => {
            panelOpen = !panelOpen;
            panel.classList.toggle('open', panelOpen);
            toggle.classList.toggle('open', panelOpen);
        });

        // Close panel when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.style-switcher') && panelOpen) {
                panelOpen = false;
                panel.classList.remove('open');
                toggle.classList.remove('open');
            }
        });

        // Style switch
        btns.forEach(btn => {
            btn.addEventListener('click', () => {
                const style = btn.dataset.style;
                if (style === currentStyle) return;

                // Update active states
                btns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Show loading
                overlay.classList.add('visible');
                frame.classList.add('loading');

                // Switch style
                currentStyle = style;
                frame.src = styleMap[style];

                // Save preference
                localStorage.setItem('preferred-style', style);
            });
        });

        // Handle iframe load
        frame.addEventListener('load', () => {
            overlay.classList.remove('visible');
            frame.classList.remove('loading');
        });

        // Restore saved preference
        const saved = localStorage.getItem('preferred-style');
        if (saved && saved !== 'blue' && styleMap[saved]) {
            const savedBtn = document.querySelector(`[data-style="${saved}"]`);
            if (savedBtn) {
                savedBtn.click();
            }
        }

        // Keyboard shortcut: 1-4 to switch styles
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            const keys = { '1': 'blue', '2': 'green', '3': 'orange', '4': 'original' };
            if (keys[e.key]) {
                const btn = document.querySelector(`[data-style="${keys[e.key]}"]`);
                if (btn) {
                    if (!panelOpen) {
                        panelOpen = true;
                        panel.classList.add('open');
                        toggle.classList.add('open');
                    }
                    btn.click();
                }
            }
        });
    </script>
</body>
</html>
