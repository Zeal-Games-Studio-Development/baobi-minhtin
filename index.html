<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minh Tín Plastics | Giải Pháp Bao Bì B2B Toàn Diện</title>
    <meta name="description" content="Minh Tín Plastics (MTP) - Nhà sản xuất bao bì, thùng carton, túi giấy, màng nhựa PE hàng đầu cho doanh nghiệp B2B tại Việt Nam.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== RESET & BASE ===== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
        }

        /* ===== FULL-SCREEN IFRAME ===== */
        #style-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            transition: opacity 0.4s ease;
        }
        #style-frame.loading { opacity: 0.3; }



        /* Loading indicator  */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .loading-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }
        
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }


    </style>
</head>
<body>

    <!-- Full-Screen iframe -->
    <iframe id="style-frame" src="styles/blue/index.html" title="Minh Tín Plastics"></iframe>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>



    <script>
        const frame = document.getElementById('style-frame');
        const overlay = document.getElementById('loadingOverlay');

        // Handle iframe load
        frame.addEventListener('load', () => {
            overlay.classList.remove('visible');
            frame.classList.remove('loading');
        });
    </script>
</body>
</html>
